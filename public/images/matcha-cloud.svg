<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Matcha Cloud</title>
  <desc id="desc">A creamy iced matcha drink with a soft vanilla cloud of foam.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe7d5"/>
      <stop offset="0.52" stop-color="#f5eee5"/>
      <stop offset="1" stop-color="#c9d6bf"/>
    </linearGradient>
    <linearGradient id="matcha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#87a96e"/>
      <stop offset="1" stop-color="#3f6848"/>
    </linearGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#e9dfd2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
